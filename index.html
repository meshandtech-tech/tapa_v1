<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` NÃO é enfeite: sem ele, no iOS, todo
         `env(safe-area-inset-*)` resolve para 0. O app já usava esses insets
         em quatro barras fixas, e todas ficavam por baixo do indicador de
         início do iPhone — os controles do host sumindo embaixo da tela era
         exatamente este bug. `maximum-scale`/`user-scalable` ficam de fora de
         propósito: bloquear zoom é problema de acessibilidade. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Modo standalone (adicionado à tela de início): a barra de status
         some e a UI passa a valer a tela toda. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#e60050" />
    <meta
      name="description"
      content="Tapa — party games em tempo real para jogar com os amigos. Cria a party, compartilha o código, todo mundo entra pelo celular e a bagunça começa. Sem instalar nada."
    />
    <!-- Sem webfont: a UI usa Helvetica, que já existe no aparelho. Uma
         requisição a menos e nenhum salto de layout enquanto a fonte carrega. -->
    <title>Tapa — Party Games para Amigos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
